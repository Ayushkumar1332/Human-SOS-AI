
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | HumanSOS AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">

<div class="auth-container">

    <div class="auth-brand">
        <h1>🛡️ HumanSOS <span>AI</span></h1>
        <p>Your intelligent emergency companion.</p>
    </div>

    <div class="auth-card">
        <h2>Welcome Back</h2>
        <p>Login to access your safety dashboard.</p>

        <form action="{{ url_for('login') }}" method="POST">

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email"
                       placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password"
                       placeholder="Enter your password" required>
            </div>

            <div class="form-options">
                <label>
                    <input type="checkbox" name="remember">
                    Remember me
                </label>
                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit" class="btn-primary full-btn">
                Login
            </button>

        </form>

        <p class="auth-switch">
            Don't have an account?
            <a href="{{ url_for('register') }}">Create Account</a>
        </p>

        <a href="{{ url_for('index') }}" class="back-home">
            ← Back to Home
        </a>
    </div>

</div>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
